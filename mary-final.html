<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary — Mother of Jesus</title>
<style>
/* ===== GLOBAL ===== */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #f2eeda 0%, #e6dfc8 100%);
  overflow: hidden;
  position: relative;
}

/* ===== STAGE ===== */
.stage {
  position: absolute;
  bottom: 120px;
  left: 0; right: 0;
  height: 400px;
  overflow: hidden;
}

/* ===== MARY CHARACTER ===== */
.mary {
  position: absolute;
  bottom: 20px;
  width: 140px; height: 280px;
  left: -200px;
}

@keyframes walkBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.mary.walking {
  animation: walkBob 0.45s infinite ease-in-out;
}

@keyframes speakBreath {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-4px) scale(1.015); }
}
.mary.speaking {
  animation: speakBreath 1.8s infinite ease-in-out;
}

.part { position: absolute; }

/* Head & Veil */
.head-wrapper {
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 90px; height: 90px;
}
.veil-back {
  width: 90px; height: 55px;
  background: linear-gradient(180deg, #4a2f44 0%, #3d2639 100%);
  clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
  border-radius: 4px 4px 0 0;
}
.veil-front {
  position: absolute; top: 10px; left: 10px;
  width: 70px; height: 50px;
  background: linear-gradient(180deg, #5a3f54 0%, #4a2f44 100%);
  clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
}
.face {
  position: absolute; top: 18px; left: 15px;
  width: 60px; height: 45px;
  background: #f2e6d8;
  border-radius: 2px;
}
.hair-fringe {
  position: absolute; top: 18px; left: 15px;
  width: 60px; height: 14px;
  background: #d4b996;
}
.eyes {
  position: absolute; top: 25px; left: 0; width: 100%;
  display: flex; justify-content: center; gap: 14px;
}
.eye {
  width: 8px; height: 8px;
  background: #2c2c2c;
  border-radius: 50%;
}
.mouth {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  width: 14px; height: 6px;
  background: #c99;
  border-radius: 0 0 10px 10px;
  transition: all 0.3s;
}
.mary.speaking .mouth {
  height: 9px; border-radius: 50%;
}

/* Robe */
.robe {
  position: absolute;
  top: 85px; left: 50%; transform: translateX(-50%);
  width: 110px; height: 195px;
  background: linear-gradient(180deg, #50384c 0%, #422d3e 50%, #352432 100%);
  clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
  border: 3px solid #2a1c28;
}
.robe-inner {
  position: absolute;
  top: 12px; left: 10px; right: 10px; bottom: 0;
  background: linear-gradient(180deg, #5c4058 0%, #4e344a 100%);
  opacity: 0.6;
}

/* Arms */
.arm-left, .arm-right {
  position: absolute;
  top: 100px;
  width: 22px; height: 75px;
  background: #50384c;
  border: 2px solid #352432;
  transform-origin: top center;
}
.arm-left { left: 12px; transform: rotate(-10deg); }
.arm-right { right: 12px; transform: rotate(10deg); }
.mary.walking .arm-left { animation: armSwingLeft 0.45s infinite alternate; }
.mary.walking .arm-right { animation: armSwingRight 0.45s infinite alternate; }
@keyframes armSwingLeft {
  from { transform: rotate(-10deg); }
  to   { transform: rotate(5deg); }
}
@keyframes armSwingRight {
  from { transform: rotate(10deg); }
  to   { transform: rotate(-5deg); }
}

/* Ground */
.ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
  background: repeating-linear-gradient(90deg, #8b7355 0 40px, #7a654c 40px 80px);
}

/* ===== SPEECH BOX ===== */
.speech-container {
  position: absolute;
  top: 30px; left: 50%; transform: translateX(-50%);
  background: #fff;
  border: 4px solid #5a3f54;
  border-radius: 8px;
  padding: 22px;
  width: 90%; max-width: 550px;
  box-shadow: 6px 6px 0 rgba(60, 40, 55, 0.2);
  opacity: 0;
  transition: opacity 0.8s ease;
}
.speech-container.visible { opacity: 1; }

.speech-text {
  font-size: 1.05rem; line-height: 1.7; color: #3a2a38;
  min-height: 80px; padding: 14px;
  background: #f8f2e8; border-radius: 4px; border: 2px solid #d9c8b8;
  margin-bottom: 15px;
}
.controls { display: flex; gap: 12px; flex-wrap: wrap; }
button {
  padding: 12px 24px; font-size: 1rem; font-weight: bold;
  border: none; border-radius: 6px; cursor: pointer; transition: all 0.25s;
}
#startBtn { background: #5a3f54; color: #fff; }
#startBtn:hover { background: #4a2f44; transform: translateY(-2px); }
#resetBtn { background: #b89a6d; color: #fff; }
#resetBtn:hover { background: #9a7d58; transform: translateY(-2px); }
.voice-status { margin-top: 12px; font-size: 0.9rem; color: #777; }
h3 { color: #5a3f54; margin-bottom: 10px; }
</style>
</head>
<body>
  
<a href="index.html" style="position: absolute; top: 15px; left: 20px; z-index: 100; 
   background: #fff; padding: 8px 16px; border-radius: 6px; border: 2px solid #b89a6d;
   text-decoration: none; color: #5a3f54; font-weight: bold; box-shadow: 2px 2px 0 rgba(0,0,0,0.1);">
  🏠 Home
</a>
  
<div class="speech-container" id="speechBox">
  <h3>Mary, Mother of Jesus — Her Story</h3>
  <p class="speech-text" id="speechText">I am ready to speak. Click below to begin.</p>
  <div class="controls">
    <button id="startBtn">🎙️ Begin Story</button>
    <button id="resetBtn">🔄 Restart</button>
  </div>
  <p class="voice-status" id="voiceStatus">Status: Ready</p>
</div>

<div class="stage">
  <div class="mary" id="mary">
    <div class="head-wrapper">
      <div class="veil-back"></div>
      <div class="veil-front"></div>
      <div class="hair-fringe"></div>
      <div class="face">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="mouth"></div>
      </div>
    </div>
    <div class="robe">
      <div class="robe-inner"></div>
    </div>
    <div class="arm-left"></div>
    <div class="arm-right"></div>
  </div>
</div>

<div class="ground"></div>

<script>
const maryScript = [
  "Greetings, dear friend. I am Mary, chosen by God to be the mother of Jesus.",
  "I was a young girl living in Nazareth when the angel Gabriel came to me.",
  "He brought wonderful news — that I would bear a son, the Son of the Most High.",
  "I was afraid, yet I trusted. I said, 'Let it be to me according to your word.'",
  "I journeyed to Bethlehem with Joseph, and there, in a humble place, Jesus was born.",
  "I held him in my arms, and treasured every moment deep in my heart.",
  "I watched him grow — full of wisdom, kindness, and the love of God.",
  "I stood by him through every moment, even when the way was hard and sorrowful.",
  "But I also witnessed his glory — his resurrection, the hope for all people.",
  "I am not just a mother. I am a servant, a believer, a woman who chose faith.",
  "My life shows what happens when we trust God completely, with all our hearts.",
  "May you also find the courage to say 'Yes' to God. Peace be with you always."
];

const synth = window.speechSynthesis;
const mary = document.getElementById('mary');
const speechBox = document.getElementById('speechBox');
const speechText = document.getElementById('speechText');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const voiceStatus = document.getElementById('voiceStatus');

let currentPart = 0;
let maryVoice = null;
const STAGE_CENTER = window.innerWidth / 2 - 70;
const STAGE_RIGHT = window.innerWidth + 100;

function loadVoices() {
  const voices = synth.getVoices();
  maryVoice = voices.find(v => 
    (v.lang === 'en-US' || v.lang === 'en-GB') && 
    v.name.toLowerCase().includes('female')
  ) || voices.find(v => v.lang === 'en-US') || voices[0];
  voiceStatus.textContent = `Voice: ${(maryVoice?.name || 'Default').slice(0,25)}… | Ready`;
}
synth.onvoiceschanged = loadVoices;
loadVoices();

function moveToCenter() {
  mary.classList.add('walking');
  mary.style.transition = 'left 2.5s ease-in-out';
  mary.style.left = `${STAGE_CENTER}px`;

  setTimeout(() => {
    mary.classList.remove('walking');
    mary.classList.add('speaking');
    speechBox.classList.add('visible');
    speakNext();
  }, 2500);
}

function speakNext() {
  if (currentPart >= maryScript.length) {
    endSpeaking();
    return;
  }

  const text = maryScript[currentPart];
  speechText.textContent = text;

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = maryVoice;
  utterance.rate = 0.8;
  utterance.pitch = 1.3;
  utterance.volume = 1.0;

  utterance.onstart = () => {
    voiceStatus.textContent = `Speaking — Part ${currentPart+1}/${maryScript.length}`;
  };
  utterance.onend = () => {
    currentPart++;
    setTimeout(speakNext, 2000);
  };

  synth.speak(utterance);
}

function endSpeaking() {
  mary.classList.remove('speaking');
  speechText.textContent = "Thank you for listening. May God bless you.";
  voiceStatus.textContent = "Finished — Mary departs";

  setTimeout(() => {
    mary.classList.add('walking');
    mary.style.transition = 'left 2.5s ease-in-out';
    mary.style.left = `${STAGE_RIGHT}px`;
  }, 3000);
}

function resetAll() {
  synth.cancel();
  currentPart = 0;
  mary.classList.remove('walking', 'speaking');
  mary.style.transition = 'none';
  mary.style.left = '-200px';
  speechBox.classList.remove('visible');
  speechText.textContent = "I am ready to speak. Click below to begin.";
  voiceStatus.textContent = "Status: Ready";
}

startBtn.addEventListener('click', moveToCenter);
resetBtn.addEventListener('click', resetAll);
</script>
</body>
</html>
