<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noah — Faithful Builder of the Ark</title>
<style>
/* ===== GLOBAL ===== */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #e6edf2 0%, #cfd8e0 100%);
  overflow: hidden;
  position: relative;
}

/* ===== STAGE ===== */
.stage {
  position: absolute;
  bottom: 120px;
  left: 0; right: 0;
  height: 400px;
  overflow: hidden;
}

/* ===== NOAH CHARACTER ===== */
.noah {
  position: absolute;
  bottom: 20px;
  width: 140px; height: 300px;
  left: -200px;
}

@keyframes walkBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.noah.walking {
  animation: walkBob 0.5s infinite ease-in-out;
}

@keyframes speakBreath {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-4px) scale(1.015); }
}
.noah.speaking {
  animation: speakBreath 1.8s infinite ease-in-out;
}

.part { position: absolute; }

/* Head & Face */
.head-wrapper {
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 90px; height: 95px;
}
.hair-back {
  width: 90px; height: 50px;
  background: linear-gradient(180deg, #d4c8b8 0%, #b8a890 100%);
  border-radius: 4px 4px 0 0;
}
.hair-front {
  position: absolute; top: 0; left: 10px;
  width: 70px; height: 24px;
  background: #e0d4c4;
  border-radius: 0 0 6px 6px;
}
.beard {
  position: absolute; top: 40px; left: 12px;
  width: 66px; height: 52px;
  background: linear-gradient(180deg, #e8dfd0 0%, #cfc2a8 100%);
  border-radius: 4px 4px 8px 8px;
  clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
}
.face {
  position: absolute; top: 18px; left: 15px;
  width: 60px; height: 42px;
  background: #e6c9a8;
  border-radius: 2px;
}
.eyes {
  position: absolute; top: 24px; left: 0; width: 100%;
  display: flex; justify-content: center; gap: 14px;
}
.eye {
  width: 9px; height: 9px;
  background: #2c2c2c;
  border-radius: 50%;
}
.mouth {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  width: 15px; height: 6px;
  background: #9a6b4a;
  border-radius: 0 0 10px 10px;
  transition: all 0.3s;
}
.noah.speaking .mouth {
  height: 9px; border-radius: 50%;
}

/* Robe — Builder / Sailor style */
.robe {
  position: absolute;
  top: 85px; left: 50%; transform: translateX(-50%);
  width: 110px; height: 210px;
  background: linear-gradient(180deg, #6b7a8f 0%, #525f72 50%, #3e4758 100%);
  clip-path: polygon(8% 0%, 92% 0%, 100% 100%, 0% 100%);
  border: 3px solid #2d3542;
}
.robe-inner {
  position: absolute;
  top: 12px; left: 10px; right: 10px; bottom: 0;
  background: linear-gradient(180deg, #7c8ca2 0%, #6b7a8f 100%);
  opacity: 0.4;
}
.cloak {
  position: absolute;
  top: 90px; left: 50%; transform: translateX(-50%);
  width: 118px; height: 200px;
  background: linear-gradient(180deg, #8fa4b8 0%, #7c94a8 100%);
  clip-path: polygon(0% 0%, 100% 0%, 92% 100%, 8% 100%);
  border: 3px solid #6b7a8f;
  opacity: 0.35;
}

/* Arms */
.arm-left, .arm-right {
  position: absolute;
  top: 105px;
  width: 24px; height: 85px;
  background: #525f72;
  border: 2px solid #2d3542;
  transform-origin: top center;
}
.arm-left { left: 10px; transform: rotate(-10deg); }
.arm-right { right: 10px; transform: rotate(10deg); }
.noah.walking .arm-left { animation: armSwingLeft 0.5s infinite alternate; }
.noah.walking .arm-right { animation: armSwingRight 0.5s infinite alternate; }
@keyframes armSwingLeft {
  from { transform: rotate(-10deg); }
  to   { transform: rotate(5deg); }
}
@keyframes armSwingRight {
  from { transform: rotate(10deg); }
  to   { transform: rotate(-5deg); }
}

/* Ground — Wooden ship deck feel */
.ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
  background: repeating-linear-gradient(90deg, #8b7355 0 40px, #7a654c 40px 80px);
}

/* ===== SPEECH BOX ===== */
.speech-container {
  position: absolute;
  top: 30px; left: 50%; transform: translateX(-50%);
  background: #fff;
  border: 4px solid #6b7a8f;
  border-radius: 8px;
  padding: 22px;
  width: 90%; max-width: 550px;
  box-shadow: 6px 6px 0 rgba(60, 70, 90, 0.2);
  opacity: 0;
  transition: opacity 0.8s ease;
}
.speech-container.visible { opacity: 1; }

.speech-text {
  font-size: 1.05rem; line-height: 1.7; color: #2a3a4a;
  min-height: 80px; padding: 14px;
  background: #f5f8fc; border-radius: 4px; border: 2px solid #d8e2ec;
  margin-bottom: 15px;
}
.controls { display: flex; gap: 12px; flex-wrap: wrap; }
button {
  padding: 12px 24px; font-size: 1rem; font-weight: bold;
  border: none; border-radius: 6px; cursor: pointer; transition: all 0.25s;
}
#startBtn { background: #6b7a8f; color: #fff; }
#startBtn:hover { background: #525f72; transform: translateY(-2px); }
#resetBtn { background: #b89a6d; color: #fff; }
#resetBtn:hover { background: #9a7d58; transform: translateY(-2px); }
.voice-status { margin-top: 12px; font-size: 0.9rem; color: #777; }
h3 { color: #525f72; margin-bottom: 10px; }
</style>
</head>
<body>
  
<a href="index.html" style="position: absolute; top: 15px; left: 20px; z-index: 100; 
   background: #fff; padding: 8px 16px; border-radius: 6px; border: 2px solid #b89a6d;
   text-decoration: none; color: #5a3f54; font-weight: bold; box-shadow: 2px 2px 0 rgba(0,0,0,0.1);">
  🏠 Home
</a>
  
<div class="speech-container" id="speechBox">
  <h3>Noah — Faithful Builder of the Ark</h3>
  <p class="speech-text" id="speechText">I am ready to speak. Click below to begin.</p>
  <div class="controls">
    <button id="startBtn">🎙️ Begin Story</button>
    <button id="resetBtn">🔄 Restart</button>
  </div>
  <p class="voice-status" id="voiceStatus">Status: Ready</p>
</div>

<div class="stage">
  <div class="noah" id="noah">
    <div class="head-wrapper">
      <div class="hair-back"></div>
      <div class="hair-front"></div>
      <div class="face">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="mouth"></div>
      </div>
      <div class="beard"></div>
    </div>
    <div class="cloak"></div>
    <div class="robe">
      <div class="robe-inner"></div>
    </div>
    <div class="arm-left"></div>
    <div class="arm-right"></div>
  </div>
</div>

<div class="ground"></div>

<script>
const noahScript = [
  "Peace be with you. I am Noah, a righteous man who walked with God.",
  "In my time, the world had grown full of violence and corruption.",
  "God saw the wickedness of humanity, and his heart was grieved.",
  "He told me: 'I will send a flood to cleanse the earth. But I will establish a covenant with you.'",
  "Build an ark, he said. Bring your family, and two of every kind of animal.",
  "I did not understand everything, but I obeyed. I built the ark just as God commanded.",
  "People laughed. They did not believe. But I kept building, in faith.",
  "When the rain came, the heavens opened, and the floodwaters covered the earth.",
  "Everything that had breath on dry land perished, but God kept us safe in the ark.",
  "The waters prevailed for many days, but God remembered me.",
  "He sent a dove, and it brought back an olive leaf — a sign that the earth was drying.",
  "When we left the ark, I built an altar and worshipped the Lord.",
  "God made a promise: never again would a flood destroy all life.",
  "The rainbow in the sky is a sign of that covenant between God and every living creature.",
  "My life teaches this: faith is not always easy, but obedience is never in vain.",
  "God will keep you safe, even when the world around you seems to be falling apart."
];

const synth = window.speechSynthesis;
const noah = document.getElementById('noah');
const speechBox = document.getElementById('speechBox');
const speechText = document.getElementById('speechText');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const voiceStatus = document.getElementById('voiceStatus');

let currentPart = 0;
let noahVoice = null;
const STAGE_CENTER = window.innerWidth / 2 - 70;
const STAGE_RIGHT = window.innerWidth + 100;

function loadVoices() {
  const voices = synth.getVoices();
  noahVoice = voices.find(v => 
    (v.lang === 'en-US' || v.lang === 'en-GB') && 
    v.name.toLowerCase().includes('male')
  ) || voices.find(v => v.lang === 'en-US') || voices[0];
  voiceStatus.textContent = `Voice: ${(noahVoice?.name || 'Default').slice(0,25)}… | Ready`;
}
synth.onvoiceschanged = loadVoices;
loadVoices();

function moveToCenter() {
  noah.classList.add('walking');
  noah.style.transition = 'left 2.5s ease-in-out';
  noah.style.left = `${STAGE_CENTER}px`;

  setTimeout(() => {
    noah.classList.remove('walking');
    noah.classList.add('speaking');
    speechBox.classList.add('visible');
    speakNext();
  }, 2500);
}

function speakNext() {
  if (currentPart >= noahScript.length) {
    endSpeaking();
    return;
  }

  const text = noahScript[currentPart];
  speechText.textContent = text;

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = noahVoice;
  utterance.rate = 0.8;
  utterance.pitch = 0.9;
  utterance.volume = 1.0;

  utterance.onstart = () => {
    voiceStatus.textContent = `Speaking — Part ${currentPart+1}/${noahScript.length}`;
  };
  utterance.onend = () => {
    currentPart++;
    setTimeout(speakNext, 2000);
  };

  synth.speak(utterance);
}

function endSpeaking() {
  noah.classList.remove('speaking');
  speechText.textContent = "Remember: the rainbow is God’s promise. Trust him, and he will keep you safe.";
  voiceStatus.textContent = "Finished — Noah departs";

  setTimeout(() => {
    noah.classList.add('walking');
    noah.style.transition = 'left 2.5s ease-in-out';
    noah.style.left = `${STAGE_RIGHT}px`;
  }, 3000);
}

function resetAll() {
  synth.cancel();
  currentPart = 0;
  noah.classList.remove('walking', 'speaking');
  noah.style.transition = 'none';
  noah.style.left = '-200px';
  speechBox.classList.remove('visible');
  speechText.textContent = "I am ready to speak. Click below to begin.";
  voiceStatus.textContent = "Status: Ready";
}

startBtn.addEventListener('click', moveToCenter);
resetBtn.addEventListener('click', resetAll);
</script>
</body>
</html>
