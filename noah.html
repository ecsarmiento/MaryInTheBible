<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noah — Faithful Builder of the Ark</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #e6edf2 0%, #cfd8e0 100%);
  overflow: hidden;
  position: relative;
}
.home-btn {
  position: absolute; top: 15px; left: 20px; z-index: 100;
  background: #fff; padding: 8px 16px; border-radius: 6px;
  border: 2px solid #6b7a8f;
  text-decoration: none; color: #4a5a6a; font-weight: bold;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
}
.home-btn:hover { background: #f5f8fc; }
.stage {
  position: absolute; bottom: 120px; left: 0; right: 0; height: 400px; overflow: hidden;
}
.noah {
  position: absolute; bottom: 20px; width: 140px; height: 300px; left: -200px;
}
@keyframes walkBob {
  0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}
}
.noah.walking{animation:walkBob 0.5s infinite ease-in-out;}
@keyframes speakBreath {
  0%,100%{transform:translateY(0)scale(1);}50%{transform:translateY(-4px)scale(1.015);}
}
.noah.speaking{animation:speakBreath 1.8s infinite ease-in-out;}
.head-wrapper{position:absolute;top:0;left:50%;transform:translateX(-50%);width:90px;height:95px;}
.hair-back{width:90px;height:50px;background:linear-gradient(180deg,#d4c8b8 0%,#b8a890 100%);border-radius:4px 4px 0 0;}
.hair-front{position:absolute;top:0;left:10px;width:70px;height:24px;background:#e0d4c4;border-radius:0 0 6px 6px;}
.beard{position:absolute;top:40px;left:12px;width:66px;height:52px;background:linear-gradient(180deg,#e8dfd0 0%,#cfc2a8 100%);border-radius:4px 4px 8px 8px;clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);}
.face{position:absolute;top:18px;left:15px;width:60px;height:42px;background:#e6c9a8;border-radius:2px;}
.eyes{position:absolute;top:24px;left:0;width:100%;display:flex;justify-content:center;gap:14px;}
.eye{width:9px;height:9px;background:#2c2c2c;border-radius:50%;}
.mouth{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:15px;height:6px;background:#9a6b4a;border-radius:0 0 10px 10px;transition:all 0.3s;}
.noah.speaking .mouth{height:9px;border-radius:50%;}
.robe{position:absolute;top:85px;left:50%;transform:translateX(-50%);width:110px;height:210px;background:linear-gradient(180deg,#6b7a8f 0%,#525f72 50%,#3e4758 100%);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);border:3px solid #2d3542;}
.robe-inner{position:absolute;top:12px;left:10px;right:10px;bottom:0;background:linear-gradient(180deg,#7c8ca2 0%,#6b7a8f 100%);opacity:0.4;}
.cloak{position:absolute;top:90px;left:50%;transform:translateX(-50%);width:118px;height:200px;background:linear-gradient(180deg,#8fa4b8 0%,#7c94a8 100%);clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);border:3px solid #6b7a8f;opacity:0.35;}
.arm-left,.arm-right{position:absolute;top:105px;width:24px;height:85px;background:#525f72;border:2px solid #2d3542;transform-origin:top center;}
.arm-left{left:10px;transform:rotate(-10deg);}
.arm-right{right:10px;transform:rotate(10deg);}
.noah.walking .arm-left{animation:armSwingL 0.5s infinite alternate;}
.noah.walking .arm-right{animation:armSwingR 0.5s infinite alternate;}
@keyframes armSwingL{from{transform:rotate(-10deg);}to{transform:rotate(5deg);}}
@keyframes armSwingR{from{transform:rotate(10deg);}to{transform:rotate(-5deg);}}
.ground{position:absolute;bottom:0;left:0;right:0;height:100px;background:repeating-linear-gradient(90deg,#8b7355 0 40px,#7a654c 40px 80px);}
.speech-container{position:absolute;top:30px;left:50%;transform:translateX(-50%);background:#fff;border:4px solid #6b7a8f;border-radius:8px;padding:22px;width:90%;max-width:550px;box-shadow:6px 6px 0 rgba(60,70,90,0.2);opacity:0;transition:opacity 0.8s ease;z-index:10;}
.speech-container.visible{opacity:1;}
.speech-text{font-size:1.05rem;line-height:1.7;color:#2a3a4a;min-height:80px;padding:14px;background:#f5f8fc;border-radius:4px;border:2px solid #d8e2ec;margin-bottom:15px;}
.controls{display:flex;gap:12px;flex-wrap:wrap;}
button{padding:12px 24px;font-size:1rem;font-weight:bold;border:none;border-radius:6px;cursor:pointer;transition:all 0.25s;}
#startBtn{background:#6b7a8f;color:#fff;}
#startBtn:hover{background:#525f72;transform:translateY(-2px);}
#resetBtn{background:#b89a6d;color:#fff;}
#resetBtn:hover{background:#9a7d58;transform:translateY(-2px);}
