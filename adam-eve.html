<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adam & Eve — The Beginning of Promise</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #e8f5e8 0%, #d0e8d0 100%);
  overflow: hidden;
  position: relative;
}
.home-btn {
  position: absolute; top: 15px; left: 20px; z-index: 100;
  background: #fff; padding: 8px 16px; border-radius: 6px;
  border: 2px solid #5a8a5a;
  text-decoration: none; color: #3a6347; font-weight: bold;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
}
.home-btn:hover { background: #f0f8e8; }
.stage {
  position: absolute; bottom: 120px; left: 0; right: 0; height: 400px; overflow: hidden;
}
.pair{position:absolute;bottom:20px;display:flex;gap:10px;left:-300px;}
.character{width:120px;height:290px;}
@keyframes walkBob {
  0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}
}
.walking{animation:walkBob 0.5s infinite ease-in-out;}
@keyframes speakBreath {
  0%,100%{transform:translateY(0)scale(1);}50%{transform:translateY(-4px)scale(1.02);}
}
.speaking{animation:speakBreath 1.8s infinite ease-in-out;}
.head-wrapper{position:relative;margin:0 auto;width:80px;height:85px;}
.hair-back-a{width:80px;height:45px;background:linear-gradient(180deg,#8b6030 0%,#6b4828 100%);border-radius:4px 4px 0 0;}
.hair-back-e{width:80px;height:50px;background:linear-gradient(180deg,#604030 0%,#482c20 100%);border-radius:4px 4px 0 0;}
.face{position:absolute;top:15px;left:10px;width:60px;height:45px;background:#e8c8a8;border-radius:3px;}
.eyes{position:absolute;top:22px;left:0;width:100%;display:flex;justify-content:center;gap:12px;}
.eye{width:9px;height:9px;background:#2c1810;border-radius:50%;}
.mouth{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:14px;height:6px;background:#906040;border-radius:0 0 10px 10px;transition:all 0.3s;}
.speaking .mouth{height:9px;border-radius:50%;}
.body-a{position:relative;margin:0 auto;width:95px;height:205px;background:linear-gradient(180deg,#709050 0%,#5a7840 100%);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);border:3px solid #4a6030;}
.body-e{position:relative;margin:0 auto;width:95px;height:205px;background:linear-gradient(180deg,#9070a0 0%,#785888 100%);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%);border:3px solid #604870;}
.arm-l,.arm-r{position:absolute;top:20px;width:20px;height:75px;background:#709050;border:2px solid #4a6030;transform-origin:top center;}
.eve .arm-l,.eve .arm-r{background:#785888;border-color:#604870;}
.arm-l{left:5px;transform:rotate(-12deg);}
.arm-r{right:5px;transform:rotate(12deg);}
.walking .arm-l{animation:armSwingL 0.5s infinite alternate;}
.walking .arm-r{animation:armSwingR 0.5s infinite alternate;}
@keyframes armSwingL{from{transform:rotate(-12deg);}to{transform:rotate(5deg);}}
@keyframes armSwingR{from{transform:rotate(12deg);}to{transform:rotate(-5deg);}}
.ground{position:absolute;bottom:0;left:0;right:0;height:100px;background:repeating-linear-gradient(90deg,#90b870 0 40px,#80a860 40px 80px);}
.speech-container{position:absolute;top:30px;left:50%;transform:translateX(-50%);background:#fff;border:4px solid #5a8a5a;border-radius:8px;padding:22px;width:90%;max-width:580px;box-shadow:6px 6px 0 rgba(90,140,90,0.15);opacity:0;transition:opacity 0.8s ease;z-index:10;}
.speech-container.visible{opacity:1;}
.speaker-tag{font-weight:bold;margin-bottom:8px;display:block;}
.adam-tag{color:#5a7840;}
.eve-tag{color:#785888;}
.speech-text{font-size:1.05rem;line-height:1.7;color:#2a3a20;min-height:80px;padding:14px;background:#f0f8e8;border-radius:4px;border:2px solid #c8e0c8;margin-bottom:15px;}
.controls{display:flex;gap:12px;flex-wrap:wrap;}
button{padding:12px 24px;font-size:1rem;font-weight:bold;border:none;border-radius:6px;cursor:pointer;transition:all 0.25s;}
#startBtn{background:#5a8a5a;color:#fff;}
#startBtn:hover{background:#4a704a;transform:translateY(-2px);}
#resetBtn{background:#785888;color:#fff;}
#resetBtn:hover{background:#604870;transform:translateY(-2px);}
.voice-status{margin-top:12px;font-size:0.9rem;color:#777;}
h3{color:#3a6347;margin-bottom:10px;}
</style>
</head>
<body>
<a href="index.html" class="home-btn">🏠 Home</a>
<div class="speech-container" id="speechBox">
  <h3>Adam & Eve — Created in God's Image</h3>
  <p class="speech-text" id="speechText">We are the first family. Click to hear our story.</p>
  <div class="controls">
    <button id="startBtn">🎙️ Begin Story</button>
    <button id="resetBtn">🔄 Restart</button>
  </div>
  <p class="voice-status" id="voiceStatus">Status: Ready</p>
</div>
<div class="stage">
  <div class="pair" id="pair">
    <div class="character adam" id="adam">
      <div class="head-wrapper">
        <div class="hair-back-a"></div>
        <div class="face">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="body-a">
        <div class="arm-l"></div>
        <div class="arm-r"></div>
      </div>
    </div>
    <div class="character eve" id="eve">
      <div class="head-wrapper">
        <div class="hair-back-e"></div>
        <div class="face">
          <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="body-e">
        <div class="arm-l"></div>
        <div class="arm-r"></div>
      </div>
    </div>
  </div>
</div>
<div class="ground"></div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const dialogue = [
    {sp:'adam',txt:'I am Adam — formed from the dust of the earth, breathed into by God himself.'},
    {sp:'adam',txt:'God walked with us in the cool of the day. We knew him face to face in the Garden of Eden.'},
    {sp:'eve',txt:'I am Eve — mother of all living. God brought us together, and we were one flesh, without shame.'},
    {sp:'eve',txt:'We were given every tree to eat — only one was forbidden. But we doubted God\'s word and chose our own way.'},
    {sp:'adam',txt:'We hid. We were afraid. Sin entered the world, and with it pain, sorrow, and separation.'},
    {sp:'eve',txt:'Yet even then, God did not abandon us. He promised a Seed — one who would crush the serpent\'s head.'},
    {sp:'adam',txt:'We left the garden, but the promise remained. We built altars, we worshipped, and we waited in hope.'},
    {sp:'eve',txt:'Through our line came the people of God. And in the fullness of time, the Promise was born.'},
    {sp:'adam',txt:'You are made in God\'s image — precious, loved, created for relationship.'},
    {sp:'eve',txt:'When you stumble, remember: God seeks you. His grace is greater than any mistake.'},
    {sp:'adam',txt:'The story did not end with us. It continues in you — and it leads to him.'},
    {sp:'eve',txt:'Walk in love. God is making all things new.'}
  ];
  const synth = window.speechSynthesis;
  const pair = document.getElementById('pair');
  const adam = document.getElementById('adam');
  const eve = document.getElementById('eve');
  const speechBox = document.getElementById('speechBox');
  const speechText = document.getElementById('speechText');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const voiceStatus = document.getElementById('voiceStatus');
  let idx=0, vAdam=null, vEve=null;
  const CENTER = window.innerWidth/2 - 130;
  const EXIT = window.innerWidth + 200;
  function loadVoices(){
    const v=synth.getVoices();
    vAdam = v.find(x=>x.name.toLowerCase().includes('male')&&(x.lang==='en-US'||x.lang==='en-GB'))||v[0];
    vEve = v.find(x=>x.name.toLowerCase().includes('female')&&(x.lang==='en-US'||x.lang==='en-GB'))||v[0];
    voiceStatus.textContent='Voices ready | Status: Ready';
  }
  synth.onvoiceschanged=loadVoices; loadVoices();
  function moveIn(){
    pair.classList.add('walking');
    pair.style.transition='left 2.5s ease-in-out';
    pair.style.left=CENTER+'px';
    setTimeout(()=>{pair.classList.remove('walking');speechBox.classList.add('visible');speak();},2500);
  }
  function speak(){
    if(idx>=dialogue.length){done();return;}
    const d=dialogue[idx];
    adam.classList.toggle('speaking',d.sp==='adam');
    eve.classList.toggle('speaking',d.sp==='eve');
    speechText.innerHTML=`<span class="speaker-tag ${d.sp}-tag">${d.sp==='adam'?'Adam':'Eve'}:</span> ${d.txt}`;
    const u=new SpeechSynthesisUtterance(d.txt);
    u.voice=d.sp==='adam'?vAdam:vEve;
    u.rate=d.sp==='adam'?0.8:0.85;
    u.pitch=d.sp==='adam'?0.9:1.05;
    u.onstart=()=>voiceStatus.textContent=`Speaking ${idx+1}/${dialogue.length}`;
    u.onend=()=>{idx++;setTimeout(speak,2000);};
    synth.speak(u);
  }
  function done(){
    adam.classList.remove('speaking'); eve.classList.remove('speaking');
    speechText.textContent='You are God\'s beloved child. His promise lives in you.';
    voiceStatus.textContent='Finished';
    setTimeout(()=>{pair.classList.add('walking');pair.style.transition='left 2.5s ease-in-out';pair.style.left=EXIT+'px';},3000);
  }
  function reset(){
    synth.cancel(); idx=0;
    adam.classList.remove('walking','speaking'); eve.classList.remove('walking','speaking');
    pair.style.transition='none'; pair.style.left='-300px';
    speechBox.classList.remove('visible');
    speechText.textContent='We are the first family. Click to hear our story.';
    voiceStatus.textContent='Status: Ready';
  }
  startBtn.addEventListener('click',moveIn);
  resetBtn.addEventListener('click',reset);
});
</script>
</body>
</html>
