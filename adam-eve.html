<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adam & Eve — The First Family</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #e8f5e8 0%, #c8e0c8 100%);
  overflow: hidden;
  position: relative;
}
.home-btn {
  position: absolute; top: 15px; left: 20px; z-index: 100;
  background: #fff; padding: 8px 16px; border-radius: 6px;
  border: 2px solid #5a9050;
  text-decoration: none; color: #3a6030; font-weight: bold;
}
.home-btn:hover { background: #f0f8f0; }
.stage { position: absolute; bottom: 100px; left: 0; right: 0; height: 400px; overflow: hidden; }
.character { position: absolute; bottom: 20px; width: 260px; height: 300px; left: -300px; }
@keyframes walkBob { 0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);} }
.character.walking{animation:walkBob 0.5s infinite ease-in-out;}
@keyframes speakBreath { 0%,100%{transform:scale(1);}50%{transform:scale(1.02);} }
.character.speaking{animation:speakBreath 1.8s infinite ease-in-out;}
.person { position: absolute; bottom: 0; width: 110px; height: 280px; }
.person-left { left: 10px; }
.person-right { right: 10px; }
.head { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 70px; height: 75px; border-radius: 50%; }
.body { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); width: 90px; height: 210px; clip-path: polygon(10% 0,90% 0,100% 100%,0 100%); }
.eye { position: absolute; width: 8px; height: 8px; background: #222; border-radius: 50%; top: 30px; }
.mouth { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 14px; height: 6px; background: #6a4; border-radius: 0 0 10px 10px; transition: all 0.3s; }
.speaking .mouth { height: 9px; border-radius: 50%; }
.adam-head { background: #d8b898; }
.adam-body { background: linear-gradient(180deg, #7a9870 0%, #5a7850 100%); border: 3px solid #4a6040; }
.eve-head { background: #f8d8c8; }
.eve-body { background: linear-gradient(180deg, #b890c0 0%, #9068a0 100%); border: 3px solid #704880; }
.eyes { position: absolute; top: 28px; width: 100%; display: flex; justify-content: center; gap: 12px; }
.ground { position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: repeating-linear-gradient(90deg, #90b880 0 40px, #78a068 40px 80px); }
.speech-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #fff; border: 4px solid #5a9050; border-radius: 8px; padding: 20px; width: 90%; max-width: 550px; box-shadow: 6px 6px 0 rgba(90,144,80,0.15); opacity: 0; transition: opacity 0.8s ease; z-index: 10; }
.speech-container.visible { opacity: 1; }
.speech-text { font-size: 1.05rem; line-height: 1.7; color: #2a5020; min-height: 80px; padding: 14px; background: #f0f8f0; border-radius: 4px; border: 2px solid #c8e0c8; margin-bottom: 15px; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; }
button { padding: 12px 24px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: all 0.25s; }
#startBtn { background: #5a9050; color: #fff; }
#startBtn:hover { background: #4a7840; transform: translateY(-2px); }
#resetBtn { background: #80b070; color: #fff; }
#resetBtn:hover { background: #689858; transform: translateY(-2px); }
.voice-status { margin-top: 12px; font-size: 0.9rem; color: #666; }
h3 { color: #4a7840; margin-bottom: 10px; }
</style>
</head>
<body>
<a href="index.html" class="home-btn">🏠 Home</a>
<div class="speech-container" id="speechBox">
  <h3>Adam & Eve — Created in God's Image</h3>
  <p class="speech-text" id="speechText">We are the first of all God's children. Click to hear our story.</p>
  <div class="controls">
    <button id="startBtn">🎙️ Begin Story</button>
    <button id="resetBtn">🔄 Restart</button>
  </div>
  <p class="voice-status" id="voiceStatus">Status: Ready</p>
</div>
<div class="stage">
  <div class="character" id="couple">
    <div class="person person-left">
      <div class="head adam-head">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="body adam-body"></div>
    </div>
    <div class="person person-right">
      <div class="head eve-head">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="body eve-body"></div>
    </div>
  </div>
</div>
<div class="ground"></div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const script = [
    "In the beginning, God created the heavens and the earth. And then he created us.",
    "Adam: I was formed from the dust of the ground, and God breathed into my nostrils the breath of life.",
    "Eve: I was made from his side — to be beside him, not above him, not below him, but equal at his heart.",
    "Together we were placed in the Garden of Eden — paradise. Every tree was beautiful and good for food.",
    "God gave us one command: 'You may eat from any tree — but not from the tree of the knowledge of good and evil. On the day you eat from it, you will surely die.'",
    "Eve: The serpent came. He said we would be like God, knowing good and evil. We ate.",
    "Adam: We saw we were naked. We hid. But there is no hiding from God.",
    "He called: 'Where are you?' We said: 'We heard you in the garden, and we were afraid.'",
    "Sin entered the world through us. Pain, toil, and separation followed. The garden was closed to us.",
    "Yet God did not abandon us. He clothed us with skins — a promise that sacrifice would one day cover our shame.",
    "He promised a child would come — born of woman — who would crush the serpent's head.",
    "We had sons: Cain, Abel, and Seth. Through Seth, the line would continue — all the way to Jesus.",
    "We made mistakes. We fell. But God's plan did not fail. His love is stronger than our failure.",
    "Every human being is made in God's image — you, too. You are precious, and you are loved."
  ];
  const synth = window.speechSynthesis;
  const couple = document.getElementById('couple');
  const speechBox = document.getElementById('speechBox');
  const speechText = document.getElementById('speechText');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const voiceStatus = document.getElementById('voiceStatus');
  let currentPart = 0, voice = null;
  const CENTER = window.innerWidth/2 - 130;
  const EXIT = window.innerWidth + 300;
  function loadVoices(){
    const v = synth.getVoices();
    voice = v.find(x=>x.lang.startsWith('en'))||v[0];
    voiceStatus.textContent = `Voice: ${(voice?.name||'Default').slice(0,25)}… | Ready`;
  }
  synth.onvoiceschanged = loadVoices; loadVoices();
  function begin(){
    couple.classList.add('walking');
    couple.style.transition = 'left 2.5s ease-in-out';
    couple.style.left = CENTER+'px';
    setTimeout(()=>{couple.classList.remove('walking');couple.classList.add('speaking');speechBox.classList.add('visible');speakNext();},2500);
  }
  function speakNext(){
    if(currentPart>=script.length){end();return;}
    speechText.textContent = script[currentPart];
    const u = new SpeechSynthesisUtterance(script[currentPart]);
    u.voice = voice; u.rate=0.85; u.pitch=1.0; u.volume=1;
    u.onstart=()=>voiceStatus.textContent=`Speaking — ${currentPart+1}/${script.length}`;
    u.onend=()=>{currentPart++;setTimeout(speakNext,2000);};
    synth.speak(u);
  }
  function end(){
    couple.classList.remove('speaking');
    speechText.textContent = "From our family came the whole human family. God's promise passes to you.";
    voiceStatus.textContent = "Finished";
    setTimeout(()=>{couple.classList.add('walking');couple.style.transition='left 2.5s ease-in-out';couple.style.left=EXIT+'px';},3000);
  }
  function reset(){
    synth.cancel(); currentPart=0;
    couple.classList.remove('walking','speaking');
    couple.style.transition='none'; couple.style.left='-300px';
    speechBox.classList.remove('visible');
    speechText.textContent="We are the first of all God's children. Click to hear our story.";
    voiceStatus.textContent="Status: Ready";
  }
  startBtn.addEventListener('click',begin);
  resetBtn.addEventListener('click',reset);
});
</script>
</body>
</html>
