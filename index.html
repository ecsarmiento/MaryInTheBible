<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mary — Minecraft-Style Character</title>
<style>
/* ===== GLOBAL STYLES ===== */
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', serif; }
body {
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(180deg, #87CEEB 0%, #98D8C8 60%, #7BC74D 100%);
  padding:20px;
  overflow-x:hidden;
}

/* ===== CHARACTER STAGE ===== */
.stage {
  position:relative;
  width:320px; height:420px;
  margin-bottom:25px;
}

/* ===== MINECRAFT-STYLE MARY ===== */
.mary {
  position:absolute;
  bottom:0; left:50%; transform:translateX(-50%);
  width:160px; height:320px;
  image-rendering:pixelated; /* Keeps blocky look */
  transition:transform 0.4s ease;
}
.mary.speaking {
  animation: gentleBob 1.2s infinite ease-in-out;
}
@keyframes gentleBob {
  0% { transform:translateX(-50%) translateY(0); }
  50% { transform:translateX(-50%) translateY(-8px); }
  100% { transform:translateX(-50%) translateY(0); }
}

/* Blocky Body Parts */
.part { position:absolute; background-size:cover; background-position:center; }
.head    { width:64px; height:64px; top:0; left:48px;
  background:linear-gradient(135deg, #F9D7B7 25%, #F5C6A0 50%, #F9D7B7 75%);
  border:3px solid #B8860B; box-shadow:inset -4px -4px 0 rgba(0,0,0,0.15); }
.hair    { width:72px; height:32px; top:0; left:44px;
  background:linear-gradient(180deg, #5D2906 0%, #4A1F03 100%);
  border:3px solid #3A1802; }
.veil    { width:96px; height:88px; top:8px; left:32px;
  background:linear-gradient(180deg, #E8E4F0 0%, #D4C8E0 100%);
  border:3px solid #9A8BB8; border-radius:4px; clip-path:polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%); }
.neck    { width:24px; height:16px; top:64px; left:68px; background:#F9D7B7; border:2px solid #B8860B; }
.torso   { width:80px; height:96px; top:80px; left:40px;
  background:linear-gradient(180deg, #B8A9D9 0%, #9A8BC8 50%, #8273B5 100%);
  border:3px solid #6B5AA8; box-shadow:inset -5px -5px 0 rgba(0,0,0,0.1); }
.robe-overlay { width:88px; height:104px; top:76px; left:36px;
  background:linear-gradient(180deg, #F0E68C 0%, #DAA520 100%);
  border:3px solid #B8860B; clip-path:polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%); opacity:0.85; }
.arm-left, .arm-right { width:24px; height:72px; top:96px; background:#B8A9D9; border:3px solid #6B5AA8; }
.arm-left  { left:12px; transform:rotate(-12deg); transform-origin:top center; }
.arm-right { right:12px; transform:rotate(12deg); transform-origin:top center; }
.hand-left, .hand-right { width:22px; height:22px; top:162px; background:#F9D7B7; border:2px solid #B8860B; }
.hand-left  { left:13px; }
.hand-right { right:13px; }
.leg-left, .leg-right { width:28px; height:64px; bottom:0; background:#9A8BC8; border:3px solid #6B5AA8; }
.leg-left  { left:44px; }
.leg-right { right:44px; }
.feet-left, .feet-right { width:32px; height:16px; bottom:0; background:#8B4513; border:2px solid #5D2906; }
.feet-left  { left:42px; }
.feet-right { right:42px; }

/* Face */
.eyes { position:absolute; top:20px; left:0; width:100%; display:flex; justify-content:center; gap:16px; }
.eye { width:10px; height:12px; background:#2C1810; border-radius:2px; }
.mouth { width:14px; height:7px; bottom:12px; left:50%; transform:translateX(-50%);
  background:#C97C7C; border-radius:0 0 8px 8px; }

/* ===== SPEECH BOX ===== */
.speech-container {
  background:#fff; border:4px solid #5D2906; border-radius:8px;
  padding:20px; max-width:520px; width:100%;
  box-shadow:6px 6px 0 rgba(0,0,0,0.15);
  margin-bottom:20px;
}
.speech-text {
  font-size:1.1rem; line-height:1.7; color:#2C1810; min-height:80px; margin-bottom:15px;
  padding:12px; background:#FDF8E8; border-radius:4px; border:2px solid #E8D8B0;
}
.controls { display:flex; gap:12px; flex-wrap:wrap; }
button {
  padding:12px 24px; font-size:1rem; font-weight:bold; border:none; border-radius:6px; cursor:pointer;
  transition:all 0.2s;
}
#startBtn { background:#8B4513; color:#fff; }
#startBtn:hover { background:#6D3510; transform:translateY(-2px); }
#pauseBtn { background:#DAA520; color:#2C1810; }
#pauseBtn:hover { background:#C08C00; transform:translateY(-2px); }
.voice-status { margin-top:12px; font-size:0.9rem; color:#555; }

/* ===== DECORATIVE BLOCKY GRASS ===== */
.grass {
  position:fixed; bottom:0; left:0; right:0; height:24px;
  background:repeating-linear-gradient(90deg, #7BC74D 0 32px, #6AB83F 32px 64px);
  z-index:-1;
}
</style>
</head>
<body>

<div class="stage">
  <div class="mary" id="mary">
    <div class="hair"></div>
    <div class="veil"></div>
    <div class="head">
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      <div class="mouth"></div>
    </div>
    <div class="neck"></div>
    <div class="torso"></div>
    <div class="robe-overlay"></div>
    <div class="arm-left"></div>
    <div class="arm-right"></div>
    <div class="hand-left"></div>
    <div class="hand-right"></div>
    <div class="leg-left"></div>
    <div class="leg-right"></div>
    <div class="feet-left"></div>
    <div class="feet-right"></div>
  </div>
</div>

<div class="speech-container">
  <h3 style="color:#5D2906; margin-bottom:10px;">Mary, Mother of Jesus — Her Story</h3>
  <p class="speech-text" id="speechText">Click the button below to hear from me...</p>
  <div class="controls">
    <button id="startBtn">🎙️ Let Me Speak</button>
    <button id="pauseBtn">⏸ Pause</button>
  </div>
  <p class="voice-status" id="voiceStatus">Status: Ready</p>
</div>

<div class="grass"></div>

<script>
// ===== SPEECH CONTENT =====
const maryScript = [
  "Greetings, dear friend. I am Mary, the one chosen to bear and raise Jesus.",
  "I was just a young girl from Nazareth when the angel Gabriel came to me.",
  "He told me I would give birth to the Son of God. I was afraid, yet I trusted God completely.",
  "I said: 'I am the Lord’s servant. May it be to me as you have said.'",
  "I married Joseph, and together we journeyed to Bethlehem. There, in a humble stable, Jesus was born.",
  "I held him close in my heart — treasuring every moment, pondering all things in silence.",
  "I watched him grow in wisdom and grace. I saw his compassion, his love for all people.",
  "And I stood by him through every trial — even at the cross, when my heart was pierced with sorrow.",
  "But I also knew the promise. I waited, and I witnessed his resurrection — the hope of all the world.",
  "I am not just a mother. I am a servant of God, a believer, a woman who chose faith above all fear.",
  "My heart belongs to God, and my life shows what happens when we trust him completely.",
  "You too are loved and called. May you also say, 'Let it be done to me.' Peace be with you."
];

// ===== TEXT-TO-SPEECH SETUP =====
const synth = window.speechSynthesis;
const mary = document.getElementById('mary');
const speechText = document.getElementById('speechText');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');
const voiceStatus = document.getElementById('voiceStatus');

let currentPart = 0;
let utterance = null;
let maryVoice = null;

// Find best voice — warm, gentle, mature female tone
function loadVoices() {
  const voices = synth.getVoices();
  maryVoice = voices.find(v => 
    v.lang === 'en-US' && v.name.toLowerCase().includes('female') ||
    v.lang === 'en-GB' && v.name.toLowerCase().includes('female')
  ) || voices.find(v => v.lang === 'en-US') || voices[0];
  
  voiceStatus.textContent = `Voice: ${maryVoice?.name || 'Default'} | Status: Ready`;
}
synth.onvoiceschanged = loadVoices;
loadVoices();

// Speak one part at a time + animate
function speakNext() {
  if (currentPart >= maryScript.length) {
    mary.classList.remove('speaking');
    speechText.textContent = "Thank you for listening. May God bless you.";
    voiceStatus.textContent = "Status: Finished";
    currentPart = 0;
    return;
  }

  const text = maryScript[currentPart];
  speechText.textContent = text;
  
  utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = maryVoice;
  utterance.rate = 0.82; // Gentle, unhurried pace
  utterance.pitch = 1.9; // Warm, motherly tone
  utterance.volume = 1.0;

  utterance.onstart = () => {
    mary.classList.add('speaking');
    voiceStatus.textContent = `Status: Speaking (Part ${currentPart+1}/${maryScript.length})`;
  };
  utterance.onend = () => {
    mary.classList.remove('speaking');
    currentPart++;
    setTimeout(speakNext, 1800); // Pause naturally between thoughts
  };
  utterance.onerror = (e) => {
    voiceStatus.textContent = `Error: ${e.error}`;
    mary.classList.remove('speaking');
  };

  synth.speak(utterance);
}

// Buttons
startBtn.addEventListener('click', () => {
  synth.cancel();
  currentPart = 0;
  speakNext();
});
pauseBtn.addEventListener('click', () => {
  synth.cancel();
  mary.classList.remove('speaking');
  voiceStatus.textContent = "Status: Paused";
});
</script>
</body>
</html>
