<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isaac & Jacob — The Promised Line</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #f0f0f8 0%, #d8d8f0 100%);
  overflow: hidden;
  position: relative;
}
.home-btn {
  position: absolute; top: 15px; left: 20px; z-index: 100;
  background: #fff; padding: 8px 16px; border-radius: 6px;
  border: 2px solid #7060c0;
  text-decoration: none; color: #484090; font-weight: bold;
}
.home-btn:hover { background: #f4f4fc; }
.stage { position: absolute; bottom: 100px; left: 0; right: 0; height: 400px; overflow: hidden; }
.duo { position: absolute; bottom: 20px; width: 260px; height: 300px; left: -300px; }
@keyframes walkBob { 0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);} }
.duo.walking{animation:walkBob 0.5s infinite ease-in-out;}
@keyframes speakBreath { 0%,100%{transform:scale(1);}50%{transform:scale(1.02);} }
.duo.speaking{animation:speakBreath 1.8s infinite ease-in-out;}
.person { position: absolute; bottom: 0; width: 110px; height: 280px; }
.person-left { left: 5px; }
.person-right { right: 5px; }
.head { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 70px; height: 75px; border-radius: 50%; }
.body { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); width: 90px; height: 210px; clip-path: polygon(10% 0,90% 0,100% 100%,0 100%); }
.eyes { position: absolute; top: 28px; width: 100%; display: flex; justify-content: center; gap: 12px; }
.eye { width: 8px; height: 8px; background: #222; border-radius: 50%; }
.mouth { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 14px; height: 6px; background: #7060a0; border-radius: 0 0 10px 10px; transition: all 0.3s; }
.speaking .mouth { height: 9px; border-radius: 50%; }
.isaac-head { background: #e8c8a0; }
.isaac-body { background: linear-gradient(180deg, #9080d0 0%, #7060b0 100%); border: 3px solid #504090; }
.jacob-head { background: #d8b898; }
.jacob-body { background: linear-gradient(180deg, #7060c0 0%, #5040a0 100%); border: 3px solid #383080; }
.ground { position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: repeating-linear-gradient(90deg, #b8b8e0 0 40px, #9898c8 40px 80px); }
.speech-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #fff; border: 4px solid #7060c0; border-radius: 8px; padding: 20px; width: 90%; max-width: 550px; box-shadow: 6px 6px 0 rgba(112,96,192,0.15); opacity: 0; transition: opacity 0.8s ease; z-index: 10; }
.speech-container.visible { opacity: 1; }
.speech-text { font-size: 1.05rem; line-height: 1.7; color: #383080; min-height: 80px; padding: 14px; background: #f4f4fc; border-radius: 4px; border: 2px solid #c8c8f0; margin-bottom: 15px; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; }
button { padding: 12px 24px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: all 0.25s; }
#startBtn { background: #7060c0; color: #fff; }
#startBtn:hover { background: #5848a0; transform: translateY(-2px); }
#resetBtn { background: #9890d0; color: #fff; }
#resetBtn:hover { background: #7870b0; transform: translateY(-2px); }
.voice-status { margin-top: 12px; font-size: 0.9rem; color: #666; }
h3 { color: #5848a0; margin-bottom: 10px; }
</style>
</head>
<body>
<a href="index.html" class="home-btn">🏠 Home</a>
<div class="speech-container" id="speechBox">
  <h3>Isaac & Jacob — The Promised Line</h3>
  <p class="speech-text" id="speechText">The promise passed from father to son. Click to hear our story.</p>
  <div class="controls">
    <button id="startBtn">🎙️ Begin Story</button>
    <button id="resetBtn">🔄 Restart</button>
  </div>
  <p class="voice-status" id="voiceStatus">Status: Ready</p>
</div>
<div class="stage">
  <div class="duo" id="duo">
    <div class="person person-left">
      <div class="head isaac-head">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="body isaac-body"></div>
    </div>
    <div class="person person-right">
      <div class="head jacob-head">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="body jacob-body"></div>
    </div>
  </div>
</div>
<div class="ground"></div>
<script>
document.addEventListener('DOMContentLoaded', function(){

    "Jacob: My name means 'he deceives.' I was not born first — but I knew the birthright carried God's blessing.",

  function loadVoices(){
    const v = synth.getVoices();
    voice = v.find(x=>x.lang.startsWith('en'))||v[0];
    voiceStatus.textContent = `Voice: ${(voice?.name||'Default').slice(0,25)}… | Ready`;
  }

    duo.classList.add('walking');
    duo.style.transition = 'left 2.5s ease-in-out';
    duo.style.left = CENTER+'px';
    setTimeout(()=>{duo.classList.remove('walking');duo.classList.add('speaking');speechBox.classList.add('visible');speakNext();},2500);
  }
  function speakNext(){

    u.onstart=()=>voiceStatus.textContent=`Speaking — ${currentPart+1}/${script.length}`;
    u.onend=()=>{currentPart++;setTimeout(speakNext,2000);};
    synth.speak(u);
  }
