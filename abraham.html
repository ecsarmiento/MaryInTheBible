<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abraham — Father of Many Nations</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #f8f0e0 0%, #e8d0b0 100%);
  overflow: hidden;
  position: relative;
}
.home-btn {
  position: absolute; top: 15px; left: 20px; z-index: 100;
  background: #fff; padding: 8px 16px; border-radius: 6px;
  border: 2px solid #a07030;
  text-decoration: none; color: #704810; font-weight: bold;
}
.home-btn:hover { background: #faf0e0; }
.stage { position: absolute; bottom: 100px; left: 0; right: 0; height: 400px; overflow: hidden; }
.abraham { position: absolute; bottom: 20px; width: 130px; height: 300px; left: -200px; }
@keyframes walkBob { 0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);} }
.abraham.walking{animation:walkBob 0.5s infinite ease-in-out;}
@keyframes speakBreath { 0%,100%{transform:scale(1);}50%{transform:scale(1.02);} }
.abraham.speaking{animation:speakBreath 1.8s infinite ease-in-out;}
.head-wrapper { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 85px; height: 90px; }
.hair { width: 85px; height: 38px; background: linear-gradient(180deg, #b89060 0%, #987040 100%); border-radius: 50% 50% 0 0; }
.beard { position: absolute; top: 48px; left: 8px; width: 70px; height: 52px; background: linear-gradient(180deg, #c8a070 0%, #a88050 100%); border-radius: 10px; clip-path: polygon(10% 0,90% 0,100% 100%,0 100%); }
.face { position: absolute; top: 18px; left: 12px; width: 60px; height: 45px; background: #e8c8a0; border-radius: 4px; }
.eyes { position: absolute; top: 24px; width: 100%; display: flex; justify-content: center; gap: 14px; }
.eye { width: 9px; height: 9px; background: #3a2010; border-radius: 50%; }
.mouth { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 16px; height: 7px; background: #806040; border-radius: 0 0 10px 10px; transition: all 0.3s; }
.abraham.speaking .mouth { height: 10px; border-radius: 50%; }
.robe { position: absolute; top: 85px; left: 50%; transform: translateX(-50%); width: 105px; height: 210px; background: linear-gradient(180deg, #c09050 0%, #a07030 50%, #805820 100%); clip-path: polygon(8% 0,92% 0,100% 100%,0 100%); border: 3px solid #604018; }
.ground { position: absolute; bottom: 0; left: 0; right: 0; height: 100px; background: repeating-linear-gradient(90deg, #d8b888 0 40px, #c09860 40px 80px); }
.speech-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: #fff; border: 4px solid #a07030; border-radius: 8px; padding: 20px; width: 90%; max-width: 550px; box-shadow: 6px 6px 0 rgba(160,112,48,0.15); opacity: 0; transition: opacity 0.8s ease; z-index: 10; }
.speech-container.visible { opacity: 1; }
.speech-text { font-size: 1.05rem; line-height: 1.7; color: #503010; min-height: 80px; padding: 14px; background: #faf0e0; border-radius: 4px; border: 2px solid #e0c090; margin-bottom: 15px; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; }
button { padding: 12px 24px; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: all 0.25s; }
#startBtn { background: #a07030; color: #fff; }
#startBtn:hover { background: #805820; transform: translateY(-2px); }
#resetBtn { background: #c09860; color: #fff; }
#resetBtn:hover { background: #a07848; transform: translateY(-2px); }
.voice-status { margin-top: 12px; font-size: 0.9rem; color: #666; }
h3 { color: #805820; margin-bottom: 10px; }
</style>
</head>
<body>
<a href="index.html" class="home-btn">🏠 Home</a>
<div class="speech-container" id="speechBox">
  <h3>Abraham — Father of Many Nations</h3>
  <p class="speech-text" id="speechText">God called me to leave everything behind. Click to hear how faith made a way.</p>
  <div class="controls">
    <button id="startBtn">🎙️ Begin Story</button>
    <button id="resetBtn">🔄 Restart</button>
  </div>
  <p class="voice-status" id="voiceStatus">Status: Ready</p>
</div>
<div class="stage">
  <div class="abraham" id="abraham">
    <div class="head-wrapper">
      <div class="hair"></div>
      <div class="face">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
      <div class="beard"></div>
    </div>
    <div class="robe"></div>
  </div>
</div>
<div class="ground"></div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const script = [
    "I was born in Ur of the Chaldeans — a land far to the east. My name was Abram then.",
    "God spoke: 'Leave your country, your people, and your father's household. Go to the land I will show you.'",
    "'I will make you into a great nation, and I will bless you. I will make your name great, and you will be a blessing.'",
    "'All peoples on earth will be blessed through you.'",
    "I was seventy-five. I did not know where I was going — but I trusted God. I set out, just as he told me.",
    "I came to the land of Canaan. God appeared again: 'To your offspring I will give this land.'",
    "Years passed. I had no child. But God said: 'Look up at the sky and count the stars — so shall your descendants be.'",
    "I believed the Lord, and he credited it to me as righteousness.",
    "My name was changed to Abraham — father of many nations. Sarah's name became Sarah — princess.",
    "At last, in our old age, Isaac was born. The child of promise — joy and laughter in our home.",
    "Then God tested me: 'Take your son, your only son, whom you love — Isaac — and sacrifice him on the mountain I will show you.'",
    "I did not understand. But I obeyed. We climbed the mountain. I bound my son and raised the knife.",
    "The angel called: 'Abraham, stop! Do not lay a hand on the boy. Now I know you fear God — you have not withheld your only son.'",
    "A ram was caught in the thicket — provided by God. We worshipped: 'The Lord Will Provide.'",
    "God swore by himself: 'Because you have done this, I will surely bless you. Your descendants will be blessed, and all nations on earth will be blessed through your offspring.'",
    "Jesus is that Offspring. Through him, God's blessing reaches you. Walk by faith, not by sight."
  ];
  const synth = window.speechSynthesis;
  const abraham = document.getElementById('abraham');
  const speechBox = document.getElementById('speechBox');
  const speechText = document.getElementById('speechText');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const voiceStatus = document.getElementById('voiceStatus');
  let currentPart = 0, voice = null;
  const CENTER = window.innerWidth/2 - 65;
  const EXIT = window.innerWidth + 200;
  function loadVoices(){
    const v = synth.getVoices();
    voice = v.find(x=>x.lang.startsWith('en'))||v[0];
    voiceStatus.textContent = `Voice: ${(voice?.name||'Default').slice(0,25)}… | Ready`;
  }
  synth.onvoiceschanged = loadVoices; loadVoices();
  function begin(){
    abraham.classList.add('walking');
    abraham.style.transition = 'left 2.5s ease-in-out';
    abraham.style.left = CENTER+'px';
    setTimeout(()=>{abraham.classList.remove('walking');abraham.classList.add('speaking');speechBox.classList.add('visible');speakNext();},2500);
  }
  function speakNext(){
    if(currentPart>=script.length){end();return;}
    speechText.textContent = script[currentPart];
    const u = new SpeechSynthesisUtterance(script[currentPart]);
    u.voice = voice; u.rate=0.82; u.pitch=0.95; u.volume=1;
    u.onstart=()=>voiceStatus.textContent=`Speaking — ${currentPart+1}/${script.length}`;
    u.onend=()=>{currentPart++;setTimeout(speakNext,2200);};
    synth.speak(u);
  }
  function end(){
    abraham.classList.remove('speaking');
    speechText.textContent = "Faith is being sure of what we hope for and certain of what we do not see.";
    voiceStatus.textContent = "Finished — The promise continues";
    setTimeout(()=>{abraham.classList.add('walking');abraham.style.transition='left 2.5s ease-in-out';abraham.style.left=EXIT+'px';},3500);
  }
  function reset(){
    synth.cancel(); currentPart=0;
    abraham.classList.remove('walking','speaking');
    abraham.style.transition='none'; abraham.style.left='-200px';
    speechBox.classList.remove('visible');
    speechText.textContent="God called me to leave everything behind. Click to hear how faith made a way.";
    voiceStatus.textContent="Status: Ready";
  }
  startBtn.addEventListener('click',begin);
  resetBtn.addEventListener('click',reset);
});
</script>
</body>
</html>
