<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abraham — Father of Many Nations</title>
<style>
/* ===== GLOBAL ===== */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', serif; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #f7f0e0 0%, #e8d8b8 100%);
  overflow: hidden;
  position: relative;
}

/* ===== STAGE ===== */
.stage {
  position: absolute;
  bottom: 120px;
  left: 0; right: 0;
  height: 400px;
  overflow: hidden;
}

/* ===== ABRAHAM CHARACTER ===== */
.abraham {
  position: absolute;
  bottom: 20px;
  width: 140px; height: 300px;
  left: -200px;
}

@keyframes walkBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
.abraham.walking {
  animation: walkBob 0.5s infinite ease-in-out;
}

@keyframes speakBreath {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-4px) scale(1.015); }
}
.abraham.speaking {
  animation: speakBreath 1.8s infinite ease-in-out;
}

.part { position: absolute; }

/* Head & Face */
.head-wrapper {
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 90px; height: 95px;
}
.hair-back {
  width: 90px; height: 50px;
  background: linear-gradient(180deg, #d4b898 0%, #b89a78 100%);
  border-radius: 4px 4px 0 0;
}
.hair-front {
  position: absolute; top: 0; left: 10px;
  width: 70px; height: 24px;
  background: #e0c8a8;
  border-radius: 0 0 6px 6px;
}
.beard {
  position: absolute; top: 40px; left: 12px;
  width: 66px; height: 52px;
  background: linear-gradient(180deg, #e8d0b0 0%, #d0b088 100%);
  border-radius: 4px 4px 8px 8px;
  clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
}
.face {
  position: absolute; top: 18px; left: 15px;
  width: 60px; height: 42px;
  background: #e6c9a8;
  border-radius: 2px;
}
.eyes {
  position: absolute; top: 24px; left: 0; width: 100%;
  display: flex; justify-content: center; gap: 14px;
}
.eye {
  width: 9px; height: 9px;
  background: #3a2a1a;
  border-radius: 50%;
}
.mouth {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  width: 15px; height: 6px;
  background: #9a6b4a;
  border-radius: 0 0 10px 10px;
  transition: all 0.3s;
}
.abraham.speaking .mouth {
  height: 9px; border-radius: 50%;
}

/* Robe — Desert shepherd style */
.robe {
  position: absolute;
  top: 85px; left: 50%; transform: translateX(-50%);
  width: 110px; height: 210px;
  background: linear-gradient(180deg, #b88630 0%, #9a7220 50%, #7a5a18 100%);
  clip-path: polygon(8% 0%, 92% 0%, 100% 100%, 0% 100%);
  border: 3px solid #5a4210;
}
.robe-inner {
  position: absolute;
  top: 12px; left: 10px; right: 10px; bottom: 0;
  background: linear-gradient(180deg, #d4a044 0%, #b88630 100%);
  opacity: 0.4;
}
.cloak {
  position: absolute;
  top: 90px; left: 50%; transform: translateX(-50%);
  width: 118px; height: 200px;
  background: linear-gradient(180deg, #e0c080 0%, #d4a855 100%);
  clip-path: polygon(0% 0%, 100% 0%, 92% 100%, 8% 100%);
  border: 3px solid #b88630;
  opacity: 0.4;
}

/* Arms */
.arm-left, .arm-right {
  position: absolute;
  top: 105px;
  width: 24px; height: 85px;
  background: #9a7220;
  border: 2px solid #5a4210;
  transform-origin: top center;
}
.arm-left { left: 10px; transform: rotate(-10deg); }
.arm-right { right: 10px; transform: rotate(10deg); }
.abraham.walking .arm-left { animation: armSwingLeft 0.5s infinite alternate; }
.abraham.walking .arm-right { animation: armSwingRight 0.5s infinite alternate; }
@keyframes armSwingLeft {
  from { transform: rotate(-10deg); }
  to   { transform: rotate(5deg); }
}
@keyframes armSwingRight {
  from { transform: rotate(10deg); }
  to   { transform: rotate(-5deg); }
}

/* Ground — Sand/desert feel */
.ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 100px;
  background: repeating-linear-gradient(90deg, #d4b888 0 40px, #c4a878 40px 80px);
}

/* ===== SPEECH BOX ===== */
.speech-container {
  position: absolute;
  top: 30px; left: 50%; transform: translateX(-50%);
  background: #fff;
  border: 4px solid #b88630;
  border-radius: 8px;
  padding: 22px;
  width: 90%; max-width: 550px;
  box-shadow: 6px 6px 0 rgba(180, 130, 30, 0.2);
  opacity: 0;
  transition: opacity 0.8s ease;
}
.speech-container.visible { opacity: 1; }

.speech-text {
  font-size: 1.05rem; line-height: 1.7; color: #4a3a20;
  min-height: 80px; padding: 14px;
  background: #fffaf0; border-radius: 4px; border: 2px solid #f0e0b8;
  margin-bottom: 15px;
}
.controls { display: flex; gap: 12px; flex-wrap: wrap; }
button {
  padding: 12px 24px; font-size: 1rem; font-weight: bold;
  border: none; border-radius: 6px; cursor: pointer; transition: all 0.25s;
}
#startBtn { background: #b88630; color: #fff; }
#startBtn:hover { background: #9a7220; transform: translateY(-2px); }
#resetBtn { background: #d4a855; color: #3a2a10; }
#resetBtn:hover { background: #b88630; transform: translateY(-2px); }
.voice-status { margin-top: 12px; font-size: 0.9rem; color: #777; }
h3 { color: #9a7220; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="speech-container" id="speechBox">
  <h3>Abraham — Father of Many Nations</h3>
  <p class="speech-text" id="speechText">I am ready to speak. Click below to begin.</p>
  <div class="controls">
    <button id="startBtn">🎙️ Begin Story</button>
    <button id="resetBtn">🔄 Restart</button>
  </div>
  <p class="voice-status" id="voiceStatus">Status: Ready</p>
</div>

<div class="stage">
  <div class="abraham" id="abraham">
    <div class="head-wrapper">
      <div class="hair-back"></div>
      <div class="hair-front"></div>
      <div class="face">
        <div class="eyes">
          <div class="eye"></div>
          <div class="eye"></div>
        </div>
        <div class="mouth"></div>
      </div>
      <div class="beard"></div>
    </div>
    <div class="cloak"></div>
    <div class="robe">
      <div class="robe-inner"></div>
    </div>
    <div class="arm-left"></div>
    <div class="arm-right"></div>
  </div>
</div>

<div class="ground"></div>

<script>
const abrahamScript = [
  "Peace be with you. I am Abraham, called by God to leave my home.",
  "I lived in Ur of the Chaldeans, settled and comfortable — until the Lord spoke.",
  "He said: 'Leave your country and your people. Go to the land I will show you.'",
  "He promised: 'I will make you into a great nation. I will bless you, and all peoples on earth will be blessed through you.'",
  "I did not know where I was going, but I trusted. I packed my things, and I went.",
  "I walked by faith, not by sight. I pitched tents, I built altars, I followed God.",
  "Years passed. I grew old. Sarah grew old. Yet God's promise remained sure.",
  "He renewed the covenant: 'Look up at the stars — so numerous will your descendants be.'",
  "I believed God, and it was credited to me as righteousness.",
  "In time, Isaac was born — the son of promise, a gift from God.",
  "Then God tested me: 'Take your son, your only son, and offer him on the mountain.'",
  "I obeyed. I trusted that even from death God would provide and keep his word.",
  "At the last moment, the angel called — and a ram was provided in the thicket.",
  "God has provided. That place is called: The Lord Will Provide.",
  "My life shows this: faith means moving forward when you cannot see the end.",
  "God's promises do not depend on your age or your strength — they depend on his faithfulness.",
  "He is your God too. Trust him, and he will lead you home."
];

const synth = window.speechSynthesis;
const abraham = document.getElementById('abraham');
const speechBox = document.getElementById('speechBox');
const speechText = document.getElementById('speechText');
const startBtn = document.getElementById('startBtn');
const resetBtn = document.getElementById('resetBtn');
const voiceStatus = document.getElementById('voiceStatus');

let currentPart = 0;
let abrahamVoice = null;
const STAGE_CENTER = window.innerWidth / 2 - 70;
const STAGE_RIGHT = window.innerWidth + 100;

function loadVoices() {
  const voices = synth.getVoices();
  abrahamVoice = voices.find(v => 
    (v.lang === 'en-US' || v.lang === 'en-GB') && 
    v.name.toLowerCase().includes('male')
  ) || voices.find(v => v.lang === 'en-US') || voices[0];
  voiceStatus.textContent = `Voice: ${(abrahamVoice?.name || 'Default').slice(0,25)}… | Ready`;
}
synth.onvoiceschanged = loadVoices;
loadVoices();

function moveToCenter() {
  abraham.classList.add('walking');
  abraham.style.transition = 'left 2.5s ease-in-out';
  abraham.style.left = `${STAGE_CENTER}px`;

  setTimeout(() => {
    abraham.classList.remove('walking');
    abraham.classList.add('speaking');
    speechBox.classList.add('visible');
    speakNext();
  }, 2500);
}

function speakNext() {
  if (currentPart >= abrahamScript.length) {
    endSpeaking();
    return;
  }

  const text = abrahamScript[currentPart];
  speechText.textContent = text;

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = abrahamVoice;
  utterance.rate = 0.8;
  utterance.pitch = 0.9;
  utterance.volume = 1.0;

  utterance.onstart = () => {
    voiceStatus.textContent = `Speaking — Part ${currentPart+1}/${abrahamScript.length}`;
  };
  utterance.onend = () => {
    currentPart++;
    setTimeout(speakNext, 2000);
  };

  synth.speak(utterance);
}

function endSpeaking() {
  abraham.classList.remove('speaking');
  speechText.textContent = "The Lord will provide. Walk by faith, and he will lead you all the way.";
  voiceStatus.textContent = "Finished — Abraham departs";

  setTimeout(() => {
    abraham.classList.add('walking');
    abraham.style.transition = 'left 2.5s ease-in-out';
    abraham.style.left = `${STAGE_RIGHT}px`;
  }, 3000);
}

function resetAll() {
  synth.cancel();
  currentPart = 0;
  abraham.classList.remove('walking', 'speaking');
  abraham.style.transition = 'none';
  abraham.style.left = '-200px';
  speechBox.classList.remove('visible');
  speechText.textContent = "I am ready to speak. Click below to begin.";
  voiceStatus.textContent = "Status: Ready";
}

startBtn.addEventListener('click', moveToCenter);
resetBtn.addEventListener('click', resetAll);
</script>
</body>
</html>
